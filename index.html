<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d201d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Мой месяц · Мост поддержки</title>
  <link rel="icon" type="image/webp" href="./icon.webp">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./platform.css">
  <script>
    try {
      const prefs = JSON.parse(localStorage.getItem('most.platform.prefs.v1') || '{}');
      document.documentElement.dataset.theme = prefs.theme === 'light' ? 'light' : 'dark';
      document.documentElement.lang = prefs.lang === 'ky' ? 'ky' : 'ru';
    } catch {}
    const query = new URLSearchParams(location.search);
    if (query.get('view') === 'mobile') document.documentElement.classList.add('full-view');
    else if (query.get('frame') === '1') document.documentElement.classList.add('force-frame');
  </script>
</head>
<body>
  <header class="desk-top"><a class="desk-logo" href="#month"></a><a class="desk-open" href="?view=mobile#month"></a></header>
  <div class="studio">
    <aside class="toc"><h2></h2><button type="button" class="toc-toggle" data-action="toc" aria-controls="catalog" aria-expanded="false"></button><nav id="catalog"></nav></aside>
    <div class="stage"><div class="phone">
      <div class="statusbar" aria-hidden="true"><span>9:41</span><i class="island"></i><span class="status-icons"></span></div>
      <div class="app-head"><a class="brand" href="#month"></a><div class="head-actions"></div></div>
      <main id="screen" tabindex="-1"></main>
      <nav class="tabs"></nav>
      <div class="gesture" aria-hidden="true"></div>
    </div></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
